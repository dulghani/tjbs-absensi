name: Deploy OutsourceHR

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend (Laravel)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy ke Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ~/domains/tjbs.co.id/laravel-backend
            git pull origin main
            cd backend
            php composer.phar install --no-dev --optimize-autoloader --no-interaction
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan optimize
            chmod -R 775 storage bootstrap/cache
            echo "Backend selesai!"

  deploy-frontend:
    name: Build & Deploy Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build React
        run: cd frontend && npm run build
        env:
          VITE_API_URL: https://api.tjbs.co.id/api

      - name: Upload ke server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "frontend/dist/*"
          target: "~/domains/tjbs.co.id/public_html/os/"
          strip_components: 2
          rm: true
EOF