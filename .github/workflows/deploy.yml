name: Deploy OutsourceHR

on:
  push:
    branches: [main]

jobs:
  deploy-backend:
    name: Deploy Backend (via Webhook)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger webhook di server
        run: |
          curl -f -X POST https://api.tjbs.co.id/deploy-webhook.php \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" \
            --max-time 120 \
            --retry 2

  deploy-frontend:
    name: Build & Deploy Frontend (via FTP)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Build React
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: https://api.tjbs.co.id/api

      - name: Upload ke server via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/dist/
          server-dir: /domains/tjbs.co.id/public_html/os/