name: Deploy OutsourceHR

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    name: Build Frontend & Trigger Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Build React
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: https://api.tjbs.co.id/api

      - name: Commit dist ke repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git pull --rebase origin main
          git add -f frontend/dist/
          git diff --staged --quiet || git commit -m "chore: build frontend [skip ci]"
          git push origin main

      - name: Trigger webhook deploy
        run: |
          curl -f -X POST https://api.tjbs.co.id/deploy-webhook.php \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_SECRET }}" \
            --max-time 300 \
            --retry 2